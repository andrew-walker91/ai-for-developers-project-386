name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install

      - name: Build TypeSpec and Frontend
        run: make build-typespec build-frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/frontend

      - name: Start backend
        run: |
          cd apps/backend
          nohup dotnet run --urls "http://+:5000" > backend.log 2>&1 &
          sleep 15
          curl -sf http://localhost:5000/health || (cat backend.log; exit 1)
        shell: bash

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: apps/frontend
        env:
          VITE_API_TARGET: http://localhost:5000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7
