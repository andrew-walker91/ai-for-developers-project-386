name: Build and Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/hexlet-booking:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/hexlet-booking:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/hexlet-booking:buildcache,mode=max

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X POST "https://api.render.com/v1/services" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "hexlet-booking",
              "type": "web",
              "image": "ghcr.io/${{ github.repository }}/hexlet-booking:latest",
              "env": "docker",
              "region": "oregon",
              "envVars": [
                {"key": "ASPNETCORE_URLS", "value": "http://+:${PORT}"}
              ]
            }'
